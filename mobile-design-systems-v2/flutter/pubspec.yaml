name: mobile_design_systems_v2
description: 판판레코드와 레저라인 모바일 파일럿
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - lib/themes/t01_neobrutalism/fonts/ibmplexsanskr/OFL.txt
    - lib/themes/t01_neobrutalism/fonts/ibmplexmono/OFL.txt
    - lib/themes/t01_neobrutalism/fonts/gasoekone/OFL.txt
    - lib/themes/t01_neobrutalism/fonts/notosanskr/OFL.txt
    - lib/themes/t01_neobrutalism/fonts/bigshouldersdisplay/OFL.txt
    - lib/themes/t30_corporate_clean_saas/fonts/geistmono/OFL.txt
    - lib/themes/t30_corporate_clean_saas/fonts/ibmplexsanskr/OFL.txt
    - lib/themes/t30_corporate_clean_saas/fonts/geist/OFL.txt
    - lib/themes/t30_corporate_clean_saas/fonts/notosanskr/OFL.txt
  fonts:
    - family: IBM Plex Sans KR
      fonts:
      - asset: lib/themes/t01_neobrutalism/fonts/ibmplexsanskr/IBMPlexSansKR-Regular.ttf
        weight: 400
      - asset: lib/themes/t01_neobrutalism/fonts/ibmplexsanskr/IBMPlexSansKR-SemiBold.ttf
        weight: 700
      - asset: lib/themes/t01_neobrutalism/fonts/ibmplexsanskr/IBMPlexSansKR-Bold.ttf
        weight: 700
    - family: Noto Sans KR
      fonts:
      - asset: lib/themes/t01_neobrutalism/fonts/notosanskr/NotoSansKR_wght.ttf
        weight: 400
    - family: Gasoek One
      fonts:
      - asset: lib/themes/t01_neobrutalism/fonts/gasoekone/GasoekOne-Regular.ttf
        weight: 400
    - family: Big Shoulders Display
      fonts:
      - asset: lib/themes/t01_neobrutalism/fonts/bigshouldersdisplay/BigShouldersDisplay_wght.ttf
        weight: 400
    - family: IBM Plex Mono
      fonts:
      - asset: lib/themes/t01_neobrutalism/fonts/ibmplexmono/IBMPlexMono-Bold.ttf
        weight: 700
      - asset: lib/themes/t01_neobrutalism/fonts/ibmplexmono/IBMPlexMono-BoldItalic.ttf
        weight: 700
      - asset: lib/themes/t01_neobrutalism/fonts/ibmplexmono/IBMPlexMono-Regular.ttf
        weight: 400
      - asset: lib/themes/t01_neobrutalism/fonts/ibmplexmono/IBMPlexMono-SemiBold.ttf
        weight: 700
      - asset: lib/themes/t01_neobrutalism/fonts/ibmplexmono/IBMPlexMono-SemiBoldItalic.ttf
        weight: 700
    - family: Geist
      fonts:
      - asset: lib/themes/t30_corporate_clean_saas/fonts/geist/Geist-Italic_wght.ttf
        weight: 400
      - asset: lib/themes/t30_corporate_clean_saas/fonts/geist/Geist_wght.ttf
        weight: 400
    - family: Geist Mono
      fonts:
      - asset: lib/themes/t30_corporate_clean_saas/fonts/geistmono/GeistMono-Italic_wght.ttf
        weight: 400
      - asset: lib/themes/t30_corporate_clean_saas/fonts/geistmono/GeistMono_wght.ttf
        weight: 400
